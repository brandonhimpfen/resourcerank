[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resourcerank"
version = "1.0.0"
description = "Structured resource evaluation for curated lists, directories, newsletters, datasets, and knowledge bases."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Brandon Himpfen" }
]
keywords = ["curation", "review", "scoring", "awesome-list", "quality", "resources"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Text Processing :: Markup :: Markdown"
]

[project.scripts]
resourcerank = "resourcerank.cli:main"

[tool.setuptools.packages.find]
include = ["resourcerank*"]
